<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Concern Form</title>
  <link rel="stylesheet" href="Student_Form.css">
</head>
<body>
  <div class="form-container">
    <h2>Student Concern Form</h2>
    <form id="complaintForm">

      <div class="form-group">
        <label for="docNumber">Document Number</label>
        <input type="text" id="docNumber" name="docNumber" readonly>
      </div>

      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your full name" required>
      </div>

      <div class="form-group">
        <label for="level">Level/Grade</label>
        <input type="text" id="level" name="level" placeholder="Enter your grade or year level" required>
      </div>

      <div class="form-group">
        <label for="type">Type of Incident</label>
        <input type="text" id="type" name="type" placeholder="e.g. Bullying, Misconduct" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="time">Time</label>
          <input type="time" id="time" name="time" required>
        </div>
        <div class="form-group">
          <label for="date">Date</label>
          <input type="date" id="date" name="date" required>
        </div>
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" name="description" rows="4" placeholder="Describe the incident in detail..." required></textarea>
      </div>

      <button type="submit">Submit Concern</button>
    </form>
  </div>

  <script src="Student_Form.js"></script>
</body>
</html>
